)}}
@media(max-width:360px){.shell{padding-left:11px;padding-right:11px}.date{display:none}.heading h1{font-size:22px}.heading p{max-width:185px}.cal-card{grid-template-columns:minmax(0,1fr) 88px;padding:14px}.cal-number{font-size:35px}.ring{width:82px;height:82px}.ring-text strong{font-size:20px}.meal{padding:0 12px}.macro-value{font-size:9px}}
.water-card{margin-top:15px;padding:20px 23px}.water-top{display:flex;justify-content:space-between;align-items:center}.water-total{margin-top:7px;font:12px 'DM Mono',monospace;color:#777}.water-total strong{font:600 27px 'DM Sans',sans-serif;letter-spacing:-.04em;color:#f2f2f0}.water-total b{font-weight:400;color:#bbb}.water-mark{width:34px;height:34px;border:1px solid #303030;border-radius:50%;display:grid;place-items:center;color:#a6c9d2;font-size:23px}.water-bar{height:5px;background:#292929;border-radius:9px;overflow:hidden;margin:15px 0}.water-bar i{display:block;height:100%;width:0;background:#8bbbc7;border-radius:9px;transition:width .35s}.water-controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.water-quick,.water-custom{display:flex;gap:7px}.water-add{border:1px solid #303030;background:#151515;border-radius:8px;color:#d6d6d6;padding:8px 11px;font-size:11px;transition:.15s}.water-add:hover{border-color:#626262;background:#1c1c1c}.water-undo{color:#888}.water-custom input{width:116px;border:1px solid #303030;background:#0b0b0b;color:white;padding:8px 10px;border-radius:8px;font:11px 'DM Mono',monospace;outline:none}.water-custom input:focus{border-color:#888}.custom-add{color:#fff;border-color:#414141}@media(max-width:520px){.water-card{margin-top:11px;padding:16px}.water-total strong{font-size:24px}.water-controls{align-items:stretch;flex-direction:column}.water-quick{display:grid;grid-template-columns:1fr 1fr 1fr}.water-add{min-height:40px;padding:8px 7px}.water-custom{width:100%}.water-custom input{width:auto;flex:1;min-height:40px;font-size:16px}.water-custom .water-add{min-width:54px}}

<body>
<main class="shell">
  <header class="topbar"><div class="brand"><div class="mark">+</div>daily<span>/ nutrition</span></div><div class="top-right"><span class="date" id="todayDate"></span><button class="iconbtn" id="resetBtn" title="Start a fresh log for today">↻ <span class="reset-label">Reset day</span></button></div></header>
  <section class="heading"><div><div class="eyebrow">Your daily overview</div><h1>Today</h1></div><button class="outline" id="goalsBtn">◎ &nbsp; Edit goals</button></section>
  <section class="grid" aria-label="Daily nutrition progress">
    <article class="card cal-card"><div><div class="card-title">Calories consumed</div><div class="cal-number"><span id="calConsumed">0</span><small> kcal</small></div><div class="subline"><b id="calRemaining">2,000</b> kcal remaining · goal <span id="calGoalText">2,000</span></div></div><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="50"/><circle class="value" id="calRing" cx="60" cy="60" r="50"/></svg><div class="ring-text"><strong id="calPercent">0%</strong><span>daily goal</span></div></div></article>
    <article class="card macros" id="macroProgress"></article>
  </section>
  <section class="card water-card" id="waterTracker" aria-label="Water tracker">
    <div class="water-top"><div><div class="card-title">Water</div><div class="water-total"><strong id="waterConsumed">0</strong><span> / <b id="waterGoalLabel">2,000</b> ml</span></div></div><div class="water-mark" aria-hidden="true">◌</div></div>
    <div class="water-bar"><i id="waterProgress"></i></div>
    <div class="water-controls"><div class="water-quick"><button class="water-add" type="button" data-water="250">+250 ml</button><button class="water-add" type="button" data-water="500">+500 ml</button><button class="water-add water-undo" type="button" data-water="-250" aria-label="Remove 250 milliliters">−250</button></div><div class="water-custom"><input id="customWaterAmount" type="number" min="1" max="5000" inputmode="numeric" placeholder="Amount in ml" aria-label="Custom water amount in milliliters"><button class="water-add custom-add" id="addCustomWater" type="button">Add</button><button class="water-add water-undo" id="removeCustomWater" type="button">Remove</button></div></div>
  </section>
  <section class="section-head"><h2>Today’s meals</h2><span id="foodCount">0 items logged</span></section>
  <section class="meals" id="mealGrid"></section>
</main>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Add food</h3><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="entryForm" novalidate><div class="form-grid" id="foodFields">
<div class="field full"><label for="foodName">Food name</label><input id="foodName" maxlength="80" placeholder="e.g. Greek yogurt with berries" required></div>
<div class="field"><label for="foodCalories">Calories <span class="unit">(kcal)</span></label><input id="foodCalories" type="number" min="0" max="10000" step="1" placeholder="0" required></div><div class="field"><label for="foodServing">Serving / quantity</label><input id="foodServing" maxlength="40" placeholder="1 serving"></div>
<div class="field"><label for="foodProtein">Protein <span class="unit">(g)</span></label><input id="foodProtein" type="number" min="0" max="1000" step="0.1" placeholder="0"></div><div class="field"><label for="foodCarbs">Carbs <span class="unit">(g)</span></label><input id="foodCarbs" type="number" min="0" max="1000" step="0.1" placeholder="0"></div>
<div class="field"><label for="foodFat">Fat <span class="unit">(g)</span></label><input id="foodFat" type="number" min="0" max="1000" step="0.1" placeholder="0"></div><div class="field"><label for="foodMeal">Meal</label><select id="foodMeal"></select></div>
</div><div class="form-grid" id="goalFields" hidden>
<div class="field full"><label for="goalCalories">Daily calories <span class="unit">(kcal)</span></label><input id="goalCalories" type="number" min="1" max="20000" step="1"></div>
<div class="field"><label for="goalProtein">Protein <span class="unit">(g, optional)</span></label><input id="goalProtein" type="number" min="1" max="2000" step="1"></div><div class="field"><label for="goalCarbs">Carbs <span class="unit">(g, optional)</span></label><input id="goalCarbs" type="number" min="1" max="2000" step="1"></div><div class="field"><label for="goalFat">Fat <span class="unit">(g, optional)</span></label><input id="goalFat" type="number" min="1" max="2000" step="1"></div><div class="field"><label for="goalWater">Water <span class="unit">(ml)</span></label><input id="goalWater" type="number" min="1" max="10000" step="50"></div>
</div><div class="validation" id="validation"></div><div class="modal-actions"><button type="button" class="outline delete-btn" id="deleteFood" hidden>Delete food</button><button type="button" class="quiet" id="cancelModal">Cancel</button><button type="submit" class="primary" id="saveButton">Add food</button></div></form></div></div>
<div class="reset-confirm" id="resetConfirm"><div class="confirm-box"><h3>Start a fresh day?</h3><p>This clears today’s food and water log. Your daily goals will stay the same.</p><div class="confirm-actions"><button class="quiet" id="keepDay">Keep log</button><button class="primary" id="confirmReset">Clear today</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const MEALS=[['Breakfast','☼'],['Lunch','◷'],['Dinner','☾'],['Snacks','◇']];const COLORS={Protein:'#e94343',Carbs:'#d1ad63',Fat:'#93a8ca'};const KEY='daily-nutrition-v1';const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let state=load(),editingId=null;const $=id=>document.getElementById(id);function defaultState(){return {goals:{calories:2000,protein:150,carbs:225,fat:67,water:2000},days:{}}}function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.goals&&s.days){s.goals.water=Number(s.goals.water)||2000;Object.values(s.days).forEach(d=>{if(!Number.isFinite(d.waterMl))d.waterMl=0});return s}}catch(e){}return defaultState()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(){return state.days[todayKey()]||(state.days[todayKey()]={items:[],waterMl:0})}const fmt=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:1});const clamp=(v,max)=>Math.min(v/max,1)*100;
function renderWater(){const amount=Number(day().waterMl||0),goal=Number(state.goals.water||2000);$('waterConsumed').textContent=fmt(amount);$('waterGoalLabel').textContent=fmt(goal);$('waterProgress').style.width=`${Math.min(amount/goal*100,100)}%`; }
function render(){renderWater();const now=new Date();$('todayDate').textContent=now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();const items=day().items;const totals={calories:0,protein:0,carbs:0,fat:0};items.forEach(x=>Object.keys(totals).forEach(k=>totals[k]+=Number(x[k]||0)));const g=state.goals;const pct=Math.round(totals.calories/g.calories*100);$('calConsumed').textContent=fmt(totals.calories);$('calRemaining').textContent=fmt(Math.max(0,g.calories-totals.calories));$('calGoalText').textContent=fmt(g.calories);$('calPercent').textContent=`${pct}%`;const circ=314.16;$('calRing').style.strokeDashoffset=circ*(1-Math.min(pct,100)/100);$('calRing').style.stroke=pct>100?'#e4c779':'var(--red)';const count=items.length;$('foodCount').textContent=`${count} ${count===1?'item':'items'} logged`;const m=$('macroProgress');m.innerHTML=['protein','carbs','fat'].map(k=>{const title=k[0].toUpperCase()+k.slice(1);const target=Number(g[k]||0),p=target>0?totals[k]/target*100:0;return `<div class="macro"><div class="macro-head"><span class="macro-name">${title}</span><span class="macro-value"><b>${fmt(totals[k])} g</b> / ${target>0?fmt(target)+' g':'no goal'}</span></div><div class="bar"><i style="--bar:${COLORS[title]};width:${target>0?Math.min(p,100):0}%"></i></div></div>`}).join('');$('mealGrid').innerHTML=MEALS.map(([name,icon])=>{const subset=items.filter(x=>x.meal===name);const kcal=subset.reduce((s,x)=>s+Number(x.calories),0);return `<article class="card meal"><div class="meal-top"><div class="meal-title"><span class="meal-icon">${icon}</span>${name}</div><span class="meal-total">${fmt(kcal)} kcal</span></div><div class="food-list">${subset.length?subset.map(x=>`<div class="food"><div><div class="food-name">${esc(x.name)}</div><div class="food-meta">${fmt(x.protein)}p · ${fmt(x.carbs)}c · ${fmt(x.fat)}f${x.serving?' · '+esc(x.serving):''}</div></div><span class="food-kcal">${fmt(x.calories)} kcal</span><span class="food-actions"><button type="button" aria-label="Edit ${esc(x.name)}" data-edit="${x.id}">✎</button></span></div>`).join(''):'<div class="empty">Nothing here yet. Add your first item.</div>'}<button class="add-row" type="button" data-add="${name}">＋ &nbsp; Add food</button></div></article>`}).join('');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openFood(meal='Breakfast',item=null){editingId=item?.id||null;$('modalTitle').textContent=item?'Edit food':'Add food';$('saveButton').textContent=item?'Save changes':'Add food';$('deleteFood').hidden=!item;$('foodFields').hidden=false;$('goalFields').hidden=true;$('entryForm').dataset.mode='food';$('foodMeal').innerHTML=MEALS.map(([n])=>`<option>${n}</option>`).join('');$('foodName').value=item?.name||'';$('foodCalories').value=item?.calories??'';$('foodServing').value=item?.serving||'';$('foodProtein').value=item?.protein??'';$('foodCarbs').value=item?.carbs??'';$('foodFat').value=item?.fat??'';$('foodMeal').value=item?.meal||meal;$('validation').textContent='';$('modalBackdrop').classList.add('open');setTimeout(()=>$('foodName').focus(),50)}
function openGoals(){$('modalTitle').textContent='Daily goals';$('saveButton').textContent='Save goals';$('deleteFood').hidden=true;$('foodFields').hidden=true;$('goalFields').hidden=false;$('entryForm').dataset.mode='goals';Object.entries(state.goals).forEach(([k,v])=>$('goal'+k[0].toUpperCase()+k.slice(1)).value=v);$('validation').textContent='';$('modalBackdrop').classList.add('open')}
function close(){ $('modalBackdrop').classList.remove('open') }function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100)}
$('mealGrid').addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add)return openFood(add.dataset.add);const edit=e.target.closest('[data-edit]');if(edit){const item=day().items.find(x=>x.id===edit.dataset.edit);if(item)openFood(item.meal,item)}});
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const mode=e.currentTarget.dataset.mode;if(mode==='food'){const name=$('foodName').value.trim(),cal=$('foodCalories').value;const numbers=['foodCalories','foodProtein','foodCarbs','foodFat'];if(!name){$('validation').textContent='Enter a food name.';return}if(cal===''||Number(cal)<0||numbers.some(id=>$(id).value!==''&&Number($(id).value)<0)){$('validation').textContent='Enter valid, non-negative nutrition values.';return}const obj={id:editingId||crypto.randomUUID(),name,calories:Number(cal),serving:$('foodServing').value.trim(),protein:Number($('foodProtein').value||0),carbs:Number($('foodCarbs').value||0),fat:Number($('foodFat').value||0),meal:$('foodMeal').value};if(editingId){const idx=day().items.findIndex(x=>x.id===editingId);if(idx>=0)day().items[idx]=obj}else day().items.push(obj);save();render();close();toast(editingId?'Food updated':'Food added')}else{const keys=['calories','protein','carbs','fat','water'];const vals=keys.map(k=>{const raw=$('goal'+k[0].toUpperCase()+k.slice(1)).value.trim();return raw===''?null:Number(raw)});if([0,4].some(i=>!Number.isFinite(vals[i])||vals[i]<=0)||[1,2,3].some(i=>vals[i]!==null&&(!Number.isFinite(vals[i])||vals[i]<=0))){$('validation').textContent='Calories and water goals are required. Optional macro goals must be greater than zero.';return}state.goals=Object.fromEntries(keys.map((k,i)=>[k,vals[i]]));save();render();close();toast('Goals updated')}});
$('deleteFood').addEventListener('click',()=>{if(editingId){day().items=day().items.filter(x=>x.id!==editingId);save();render();close();toast('Food removed')}});$('goalsBtn').addEventListener('click',openGoals);$('closeModal').addEventListener('click',close);$('cancelModal').addEventListener('click',close);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('resetConfirm').classList.remove('open')}});$('resetBtn').addEventListener('click',()=>$('resetConfirm').classList.add('open'));$('keepDay').addEventListener('click',()=>$('resetConfirm').classList.remove('open'));$('confirmReset').addEventListener('click',()=>{state.days[todayKey()]={items:[]};save();render();$('resetConfirm').classList.remove('open');toast('Today’s log cleared')});$('waterTracker').addEventListener('click',e=>{const quick=e.target.closest('[data-water]'),add=e.target.closest('#addCustomWater'),remove=e.target.closest('#removeCustomWater');let amount=quick?Number(quick.dataset.water):0;if(add||remove){amount=Number($('customWaterAmount').value);if(!Number.isFinite(amount)||amount<=0||amount>5000){toast('Enter an amount from 1 to 5,000 ml');return}}if(!amount)return;const d=day(),current=Number(d.waterMl||0);d.waterMl=remove?Math.max(0,current-amount):Math.max(0,current+amount);save();renderWater();if(add||remove)$('customWaterAmount').value='';});$('customWaterAmount').addEventListener('keydown',e=>{if(e.key==='Enter'){$('addCustomWater').click()}});render();
})();
</script>
</body></html>
